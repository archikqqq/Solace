<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- фон: светлый, без рисунка -->
  <rect width="512" height="512" rx="112" fill="#F5F5F5"/>
  <!-- планета: круг толще (safe zone ~66%) -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#1C1B1F" stroke-width="24"/>
  <!-- кольцо толще, наклон -->
  <ellipse cx="256" cy="256" rx="170" ry="48" transform="rotate(-20 256 256)"
           fill="none" stroke="#1C1B1F" stroke-width="24"/>
</svg>
